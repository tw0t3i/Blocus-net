   /* =========================

    .chat-form {

```
<!-- =========================
     CONNEXION
     ========================= -->

<div id="login">

    <div class="login-box">

        <h1>Blocus.net</h1>

        <p>Choisis ton pseudo pour continuer.</p>

        <input
            id="usernameInput"
            type="text"
            maxlength="20"
            placeholder="Ton pseudo"
            autocomplete="off"
        >

        <button id="loginButton">
            Entrer
        </button>

    </div>

</div>


<!-- =========================
     APPLICATION
     ========================= -->

<div id="app">

    <!-- BARRE DU HAUT -->

  <header class="topbar">

    <div class="logo">
        Blocus.net
    </div>

    <div class="online-counter">

    <button id="onlineButton">
        <span id="onlineCount">0</span>
        <span>en ligne</span>
    </button>

</div>

<div id="onlinePanel">

    <div class="online-panel-header">
        <span>Personnes en ligne</span>
        <button id="closeOnlinePanel">Fermer</button>
    </div>

    <div id="onlineUsers"></div>

</div>
     
</header>


    <div class="content">


        <!-- =========================
             SALONS
             ========================= -->

        <aside class="sidebar">

            <div class="sidebar-title">
                SALONS
            </div>


            <button
                class="room-button active"
                data-room="general"
            >
                Général
            </button>


            <button
                class="room-button"
                data-room="lycee-a"
            >
                Jules Ferry - Versailles
            </button>


            <button
                class="room-button"
                data-room="lycee-b"
            >
                Van-Gogh - Aubergenville
            </button>


            <button
                class="room-button"
                data-room="lycee-c"
            >
                Marie-Curie - Versailles
            </button>


            <div class="separator"></div>


            <div class="sidebar-title">
                INFORMATIONS
            </div>


            <button
                class="room-button"
                data-room="actualites"
            >
                Actualités
            </button>

        </aside>


        <!-- =========================
             CHAT
             ========================= -->

        <main class="main">


            <div class="room-header">

                <div
                    class="room-title"
                    id="roomTitle"
                >
                    Général
                </div>

            </div>


            <div id="messages"></div>

            <div id="actualites"></div>


            <form
                class="chat-form"
                id="form"
            >

                <input
                    id="messageInput"
                    type="text"
                    maxlength="500"
                    placeholder="Écrire un message..."
                    autocomplete="off"
                >

                <button
                    class="send-button"
                    type="submit"
                >
                    Envoyer
                </button>

            </form>


        </main>

    </div>

</div>


<!-- Socket.IO -->

<script src="/socket.io/socket.io.js"></script>


<script>

    // =========================
    // SOCKET.IO
    // =========================

    const socket = io();


    // =========================
    // ÉLÉMENTS
    // =========================

    const login = document.getElementById("login");

    const app = document.getElementById("app");

    const usernameInput =
        document.getElementById("usernameInput");

    const loginButton =
        document.getElementById("loginButton");

    const form =
        document.getElementById("form");

    const messageInput =
        document.getElementById("messageInput");

    const messages =
        document.getElementById("messages");

   const actualitesContainer =
    document.getElementById("actualites");

    const roomTitle =
        document.getElementById("roomTitle");

   const onlineCount =
    document.getElementById("onlineCount");

   const onlineButton =
    document.getElementById("onlineButton");

   const onlinePanel =
    document.getElementById("onlinePanel");

   const closeOnlinePanel =
    document.getElementById("closeOnlinePanel");

   const onlineUsers =
    document.getElementById("onlineUsers");
   
    const roomButtons =
        document.querySelectorAll(".room-button");


    // =========================
    // VARIABLES
    // =========================

    let username = "";

    let currentRoom = "general";


    // =========================
    // NOM DES SALONS
    // =========================

    const roomNames = {

        "general": "Général",

        "lycee-a": "Jules Ferry - Versailles",

        "lycee-b": "Van-Gogh - Aubergenville",

        "lycee-c": "Marie Curie - Versailles",

        "actualites": "Actualités"

    };


    // =========================
    // CONNEXION
    // =========================

  loginButton.addEventListener("click", () => {

    const value =
        usernameInput.value.trim();


    if (value === "") {

        alert("Choisis un pseudo.");

        return;

    }


    username = value;


    socket.emit(
        "set username",
        username
    );

});

   socket.on("username accepted", () => {

    login.style.display = "none";

    app.style.display = "block";

    joinRoom("general");

});

   socket.on("username taken", () => {

    alert(
        "Ce pseudo est déjà utilisé par une personne en ligne."
    );

    usernameInput.focus();

    usernameInput.select();

});


    // Entrée dans le champ pseudo

    usernameInput.addEventListener(
        "keydown",
        (event) => {

            if (event.key === "Enter") {

                loginButton.click();

            }

        }
    );


    // =========================
    // CHANGER DE SALON
    // =========================

    roomButtons.forEach((button) => {

        button.addEventListener(
            "click",
            () => {

                const room =
                    button.dataset.room;

                joinRoom(room);

            }
        );

    });


    function joinRoom(room) {

        currentRoom = room;

       if (room === "actualites") {

    messages.style.display = "none";

    actualitesContainer.style.display = "block";

    form.style.display = "none";

    socket.emit("get actualites");

} else {

    messages.style.display = "block";

    actualitesContainer.style.display = "none";

    form.style.display = "flex";

}

        // Informer le serveur

        socket.emit(
            "join room",
            room
        );


        // Changer le titre

        roomTitle.textContent =
            roomNames[room];


        // Vider les anciens messages

        messages.innerHTML = "";


        // Modifier le bouton actif

        roomButtons.forEach(
            (button) => {

                button.classList.remove(
                    "active"
                );

            }
        );


        const activeButton =
            document.querySelector(
                `[data-room="${room}"]`
            );


        if (activeButton) {

            activeButton.classList.add(
                "active"
            );

        }


        messageInput.focus();

    }


    // =========================
    // ENVOYER UN MESSAGE
    // =========================

    form.addEventListener(
        "submit",
        (event) => {

            event.preventDefault();


            const message =
                messageInput.value.trim();


            if (message === "") {

                return;

            }


            socket.emit(
                "chat message",
                message
            );


            messageInput.value = "";

            messageInput.focus();

        }
    );

// =========================
// AFFICHER LES ACTUALITÉS
// =========================

socket.on("actualites", (posts) => {

    actualitesContainer.innerHTML = "";

    posts.forEach((post) => {

        const postElement =
            document.createElement("article");

        postElement.classList.add("actualite");


        const titleElement =
            document.createElement("h2");

        titleElement.textContent =
            post.title;


        const contentElement =
            document.createElement("p");

        contentElement.textContent =
            post.content;


        const dateElement =
            document.createElement("div");

        dateElement.classList.add(
            "actualite-date"
        );

        dateElement.textContent =
            post.date;


        postElement.appendChild(
            titleElement
        );

        postElement.appendChild(
            contentElement
        );

        postElement.appendChild(
            dateElement
        );


        actualitesContainer.appendChild(
            postElement
        );

    });

});

   
// =========================
// AFFICHER UN MESSAGE
// =========================

function afficherMessage(data) {

    const messageElement =
        document.createElement("div");

    messageElement.classList.add(
        "message"
    );


    const usernameElement =
        document.createElement("div");

    usernameElement.classList.add(
        "username"
    );

    usernameElement.textContent =
        data.username;


    const textElement =
        document.createElement("div");

    textElement.classList.add(
        "message-text"
    );

    textElement.textContent =
        data.message;


    messageElement.appendChild(
        usernameElement
    );

    messageElement.appendChild(
        textElement
    );


    messages.appendChild(
        messageElement
    );

}


// =========================
// HISTORIQUE D'UN SALON
// =========================

socket.on(
    "room history",
    (history) => {

        // Vider les messages affichés

        messages.innerHTML = "";


        // Afficher tous les anciens messages

        history.forEach(
            (message) => {

                afficherMessage(message);

            }
        );


        // Aller directement en bas

        messages.scrollTop =
            messages.scrollHeight;

    }
);


// =========================
// NOUVEAU MESSAGE
// =========================

socket.on(
    "chat message",
    (data) => {

        // Ne pas afficher un message
        // provenant d'un autre salon

        if (data.room !== currentRoom) {
            return;
        }


        afficherMessage(data);


        // Descendre automatiquement

        messages.scrollTop =
            messages.scrollHeight;

    }
);

// =========================
// UTILISATEURS EN LIGNE
// =========================

socket.on("online count", (count) => {

    onlineCount.textContent = count;

});

   // =========================
// LISTE DES UTILISATEURS
// =========================

socket.on("online users", (users) => {

    onlineUsers.innerHTML = "";


    if (users.length === 0) {

        const emptyMessage =
            document.createElement("div");

        emptyMessage.classList.add(
            "online-user"
        );

        emptyMessage.textContent =
            "Aucune personne en ligne.";

        onlineUsers.appendChild(
            emptyMessage
        );

        return;
    }


    users.forEach((username) => {

        const userElement =
            document.createElement("div");

        userElement.classList.add(
            "online-user"
        );

        userElement.textContent =
            username;

        onlineUsers.appendChild(
            userElement
        );

    });

});


// =========================
// OUVRIR LA LISTE
// =========================

onlineButton.addEventListener(
    "click",
    () => {

        onlinePanel.style.display = "block";

    }
);


// =========================
// FERMER LA LISTE
// =========================

closeOnlinePanel.addEventListener(
    "click",
    () => {

        onlinePanel.style.display = "none";

    }
);

   
</script>
