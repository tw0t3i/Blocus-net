<!DOCTYPE html>

<html lang="fr">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Blocus.net</title>

<style>

    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #111214;
        color: #e8e8e8;
        overflow: hidden;
    }

    /* =========================
       CONNEXION
       ========================= */

    #login {
        position: fixed;
        inset: 0;

        background: #111214;

        display: flex;
        justify-content: center;
        align-items: center;

        z-index: 1000;
    }

    .login-box {
        width: 340px;

        background: #18191c;
        border: 1px solid #2b2d31;

        border-radius: 12px;

        padding: 30px;

        text-align: center;
    }

    .login-box h1 {
        margin: 0 0 8px;

        color: #ffffff;
        font-size: 28px;
    }

    .login-box p {
        color: #9699a0;
        margin-bottom: 20px;
    }

    #usernameInput {
        width: 100%;

        background: #111214;
        color: #ffffff;

        border: 1px solid #303238;
        border-radius: 7px;

        padding: 12px;

        font-size: 15px;
        outline: none;

        margin-bottom: 10px;
    }

    #usernameInput:focus {
        border-color: #555963;
    }

    #loginButton {
        width: 100%;

        background: #ffffff;
        color: #111214;

        border: none;
        border-radius: 7px;

        padding: 12px;

        font-size: 15px;
        font-weight: bold;

        cursor: pointer;
    }

    #loginButton:hover {
        background: #dcdcdc;
    }

    /* =========================
       APPLICATION
       ========================= */

    #app {
        display: none;

        height: 100vh;
        width: 100%;
    }

    /* =========================
       BARRE DU HAUT
       ========================= */

    .topbar {
        height: 64px;

        background: #18191c;
        border-bottom: 1px solid #2b2d31;

        display: flex;
        align-items: center;

        padding: 0 22px;
    }

    .logo {
        color: #ffffff;

        font-size: 22px;
        font-weight: bold;
    }

   .online-counter {
    margin-left: auto;

    display: flex;
    align-items: center;

    gap: 6px;

    color: #9699a0;

    font-size: 14px;
}

#onlineCount {
    color: #ffffff;

    font-weight: bold;
}

   #onlineButton {
    display: flex;
    align-items: center;
    gap: 6px;

    background: transparent;
    color: #9699a0;

    border: none;

    font-size: 14px;

    cursor: pointer;
}

#onlineButton:hover {
    color: #ffffff;
}


/* =========================
   PANNEAU DES UTILISATEURS
   ========================= */

#onlinePanel {
    position: fixed;

    top: 74px;
    right: 20px;

    width: 280px;

    background: #18191c;

    border: 1px solid #2b2d31;
    border-radius: 10px;

    box-shadow: 0 8px 30px rgba(0, 0, 0, 0.35);

    z-index: 500;

    display: none;
}


.online-panel-header {
    display: flex;
    align-items: center;
    justify-content: space-between;

    padding: 15px;

    border-bottom: 1px solid #2b2d31;

    color: #ffffff;

    font-weight: bold;
}


#closeOnlinePanel {
    background: transparent;

    border: none;

    color: #9699a0;

    cursor: pointer;

    font-size: 13px;
}

#closeOnlinePanel:hover {
    color: #ffffff;
}


#onlineUsers {
    max-height: 300px;

    overflow-y: auto;

    padding: 10px;
}


.online-user {
    padding: 9px 8px;

    color: #d0d2d6;

    font-size: 14px;

    border-radius: 6px;
}

.online-user:hover {
    background: #25272b;
}

    /* =========================
       BARRE LATÉRALE
       ========================= */

    .sidebar {
        width: 230px;

        background: #18191c;
        border-right: 1px solid #2b2d31;

        padding: 22px 14px;

        flex-shrink: 0;
    }

    .sidebar-title {
        color: #777a82;

        font-size: 12px;
        font-weight: bold;

        letter-spacing: 1px;

        margin: 0 10px 10px;
    }

    .room-button {
        width: 100%;

        display: block;

        background: transparent;
        color: #aeb1b7;

        border: none;
        border-radius: 7px;

        padding: 11px 12px;

        margin-bottom: 4px;

        text-align: left;

        font-size: 15px;

        cursor: pointer;
    }

    .room-button:hover {
        background: #25272b;
        color: #ffffff;
    }

    .room-button.active {
        background: #2b2e34;
        color: #ffffff;
    }

    .separator {
        height: 1px;

        background: #2b2d31;

        margin: 18px 8px;
    }

    /* =========================
       ZONE PRINCIPALE
       ========================= */

    .main {
        flex: 1;

        min-width: 0;

        display: flex;
        flex-direction: column;

        background: #111214;
    }

    .room-header {
        height: 64px;

        display: flex;
        align-items: center;

        padding: 0 24px;

        background: #18191c;
        border-bottom: 1px solid #2b2d31;
    }

    .room-title {
        color: #ffffff;

        font-size: 18px;
        font-weight: bold;
    }

    /* =========================
       MESSAGES
       ========================= */

    #messages {
        flex: 1;

        overflow-y: auto;

        padding: 22px;
    }

    .message {
        margin-bottom: 16px;
    }

    .username {
        color: #ffffff;

        font-size: 14px;
        font-weight: bold;

        margin-bottom: 4px;
    }

    .message-text {
        color: #d0d2d6;

        font-size: 15px;

        line-height: 1.45;

        word-break: break-word;
    }


   /* =========================
   ACTUALITÉS
   ========================= */

#actualites {
    flex: 1;

    overflow-y: auto;

    padding: 22px;
    max-width: 850px;
    width: 100%;

    margin: 0 auto;
}


.actualite {
    background: #18191c;

    border: 1px solid #2b2d31;
    border-radius: 10px;

    padding: 20px;

    margin-bottom: 15px;
}


.actualite h2 {
    margin: 0 0 10px;

    color: #ffffff;

    font-size: 18px;
}


.actualite p {
    margin: 0 0 15px;

    color: #d0d2d6;

    font-size: 15px;

    line-height: 1.5;

    white-space: pre-wrap;
}


.actualite-date {
    color: #777a82;

    font-size: 13px;
}

    /* =========================
       ZONE D'ÉCRITURE
       ========================= */

    .chat-form {
        display: flex;

        gap: 10px;

        padding: 15px 20px;

        background: #18191c;
        border-top: 1px solid #2b2d31;
    }

    #messageInput {
        flex: 1;

        background: #111214;
        color: #ffffff;

        border: 1px solid #303238;
        border-radius: 7px;

        padding: 12px;

        font-size: 15px;

        outline: none;
    }

    #messageInput:focus {
        border-color: #555963;
    }

    .send-button {
        background: #ffffff;
        color: #111214;

        border: none;
        border-radius: 7px;

        padding: 0 20px;

        font-weight: bold;

        cursor: pointer;
    }

    .send-button:hover {
        background: #dcdcdc;
    }

    /* =========================
       STRUCTURE
       ========================= */

    .content {
        display: flex;

        height: calc(100vh - 64px);
    }

    /* =========================
       MOBILE
       ========================= */

    @media (max-width: 650px) {

    .sidebar {
        width: 140px;
        padding: 15px 6px;
    }

    .topbar {
        height: 55px;
        padding: 0 10px;
    }

    .logo {
        font-size: 20px;
    }

    .online-counter {
    margin-left: auto;
    margin-right: 5px;
}

.online-counter button {
    padding: 7px 8px;
    font-size: 13px;
    white-space: nowrap;
}

    .room-header {
        height: 55px;
        padding: 0 10px;
    }

    #messages {
        padding: 10px;
    }

    .chat-form {
        padding: 8px;
    }

    .chat-form input {
        min-width: 0;
    }

    .send-button {
        padding: 0 12px;
    }

}

    /* =========================
       RÉPONSES ET IMAGES
       ========================= */

    .message-actions {
        display: inline-block;
        margin-left: 10px;
    }

    .reply-button {
        background: none;
        border: none;
        color: #80848e;
        font-size: 12px;
        cursor: pointer;
        padding: 0;
        opacity: 0;
    }

    .message:hover .reply-button,
    .reply-button:focus {
        opacity: 1;
    }

    .reply-button:hover {
        color: #ffffff;
    }

    @media (hover: none) {
        .reply-button {
            opacity: 1;
        }
    }

    .reply-quote {
        border-left: 3px solid #555963;
        background: #18191c;
        border-radius: 4px;
        padding: 5px 9px;
        margin-bottom: 5px;
        font-size: 13px;
        color: #a0a3aa;
        cursor: pointer;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
    }

    .reply-quote:hover {
        background: #1f2024;
    }

    .reply-quote strong {
        color: #ffffff;
        margin-right: 6px;
    }

    .message.highlight {
        background: #23252a;
        border-radius: 6px;
        transition: background 0.3s;
    }

    .message-image {
        display: block;
        max-width: 320px;
        max-height: 320px;
        width: auto;
        height: auto;
        margin-top: 6px;
        border-radius: 8px;
        cursor: zoom-in;
    }

    #replyBar,
    #imagePreview {
        display: none;

        align-items: center;
        gap: 10px;

        padding: 8px 20px;

        background: #1c1d21;
        border-top: 1px solid #2b2d31;

        font-size: 13px;
        color: #a0a3aa;
    }

    #replyBar span,
    #imagePreview span {
        flex: 1;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
    }

    #replyBar strong {
        color: #ffffff;
    }

    #previewThumb {
        height: 44px;
        width: 44px;
        object-fit: cover;
        border-radius: 6px;
    }

    #cancelReply,
    #removeImage {
        background: none;
        border: none;
        color: #a0a3aa;
        cursor: pointer;
        font-size: 16px;
    }

    #cancelReply:hover,
    #removeImage:hover {
        color: #ffffff;
    }

    #attachButton {
        background: #111214;
        color: #ffffff;

        border: 1px solid #303238;
        border-radius: 7px;

        padding: 0 14px;

        font-size: 18px;
        cursor: pointer;
    }

    #attachButton:hover {
        border-color: #555963;
    }

    #lightbox {
        display: none;

        position: fixed;
        inset: 0;
        z-index: 1000;

        background: rgba(0, 0, 0, 0.88);

        align-items: center;
        justify-content: center;

        cursor: zoom-out;
    }

    #lightbox img {
        max-width: 94vw;
        max-height: 94vh;
        border-radius: 6px;
    }

    @media (max-width: 650px) {

        #replyBar,
        #imagePreview {
            padding: 6px 8px;
        }

        .message-image {
            max-width: 100%;
        }

        #attachButton {
            padding: 0 10px;
        }

    }

</style>
</head>

<body>

<!-- =========================
     CONNEXION
     ========================= -->

<div id="login">

    <div class="login-box">

        <h1>Blocus.net</h1>

        <p>Choisis ton pseudo pour continuer.</p>

        <input
            id="usernameInput"
            type="text"
            maxlength="20"
            placeholder="Ton pseudo"
            autocomplete="off"
        >

        <button id="loginButton">
            Entrer
        </button>

    </div>

</div>


<!-- =========================
     APPLICATION
     ========================= -->

<div id="app">

    <!-- BARRE DU HAUT -->

  <header class="topbar">

    <div class="logo">
        Blocus.net
    </div>

    <div class="online-counter">

    <button id="onlineButton">
        <span id="onlineCount">0</span>
        <span>en ligne</span>
    </button>

</div>

<div id="onlinePanel">

    <div class="online-panel-header">
        <span>Personnes en ligne</span>
        <button id="closeOnlinePanel">Fermer</button>
    </div>

    <div id="onlineUsers"></div>

</div>
     
</header>


    <div class="content">


        <!-- =========================
             SALONS
             ========================= -->

        <aside class="sidebar">

            <div class="sidebar-title">
                SALONS
            </div>


            <button
                class="room-button active"
                data-room="general"
            >
                Général
            </button>


            <button
                class="room-button"
                data-room="lycee-a"
            >
                Jules Ferry - Versailles
            </button>


            <button
                class="room-button"
                data-room="lycee-b"
            >
                Van-Gogh - Aubergenville
            </button>


            <button
                class="room-button"
                data-room="lycee-c"
            >
                Marie-Curie - Versailles
            </button>


            <div class="separator"></div>


            <div class="sidebar-title">
                INFORMATIONS
            </div>


            <button
                class="room-button"
                data-room="actualites"
            >
                Actualités
            </button>

        </aside>


        <!-- =========================
             CHAT
             ========================= -->

        <main class="main">


            <div class="room-header">

                <div
                    class="room-title"
                    id="roomTitle"
                >
                    Général
                </div>

            </div>


            <div id="messages"></div>

            <div id="actualites"></div>


            <div id="replyBar">
                <span id="replyText"></span>
                <button type="button" id="cancelReply" title="Annuler">✕</button>
            </div>

            <div id="imagePreview">
                <img id="previewThumb" alt="">
                <span>Image prête à être envoyée</span>
                <button type="button" id="removeImage" title="Retirer l'image">✕</button>
            </div>


            <form
                class="chat-form"
                id="form"
            >

                <input
                    id="imageInput"
                    type="file"
                    accept="image/png,image/jpeg,image/webp,image/gif"
                    hidden
                >

                <button
                    type="button"
                    id="attachButton"
                    title="Envoyer une image"
                >
                    📎
                </button>

                <input
                    id="messageInput"
                    type="text"
                    maxlength="500"
                    placeholder="Écrire un message..."
                    autocomplete="off"
                >

                <button
                    class="send-button"
                    type="submit"
                >
                    Envoyer
                </button>

            </form>


        </main>

    </div>

</div>


<div id="lightbox"><img id="lightboxImg" alt=""></div>

<!-- Socket.IO -->

<script src="/socket.io/socket.io.js"></script>


<script>

    // =========================
    // SOCKET.IO
    // =========================

    const socket = io();


    // =========================
    // ÉLÉMENTS
    // =========================

    const login = document.getElementById("login");

    const app = document.getElementById("app");

    const usernameInput =
        document.getElementById("usernameInput");

    const loginButton =
        document.getElementById("loginButton");

    const form =
        document.getElementById("form");

    const messageInput =
        document.getElementById("messageInput");

    const messages =
        document.getElementById("messages");

   const actualitesContainer =
    document.getElementById("actualites");

    const roomTitle =
        document.getElementById("roomTitle");

   const onlineCount =
    document.getElementById("onlineCount");

   const onlineButton =
    document.getElementById("onlineButton");

   const onlinePanel =
    document.getElementById("onlinePanel");

   const closeOnlinePanel =
    document.getElementById("closeOnlinePanel");

   const onlineUsers =
    document.getElementById("onlineUsers");
   
    const roomButtons =
        document.querySelectorAll(".room-button");


    // =========================
    // VARIABLES
    // =========================

    let username = "";

    let currentRoom = "general";


    // =========================
    // NOM DES SALONS
    // =========================

    const roomNames = {

        "general": "Général",

        "lycee-a": "Jules Ferry - Versailles",

        "lycee-b": "Van-Gogh - Aubergenville",

        "lycee-c": "Marie Curie - Versailles",

        "actualites": "Actualités"

    };


    // =========================
    // CONNEXION
    // =========================

  loginButton.addEventListener("click", () => {

    const value =
        usernameInput.value.trim();


    if (value === "") {

        alert("Choisis un pseudo.");

        return;

    }


    username = value;


    socket.emit(
        "set username",
        username
    );

});

   socket.on("username accepted", () => {

    login.style.display = "none";

    app.style.display = "block";

    joinRoom("general");

});

   socket.on("username taken", () => {

    alert(
        "Ce pseudo est déjà utilisé par une personne en ligne."
    );

    usernameInput.focus();

    usernameInput.select();

});


    // Entrée dans le champ pseudo

    usernameInput.addEventListener(
        "keydown",
        (event) => {

            if (event.key === "Enter") {

                loginButton.click();

            }

        }
    );


    // =========================
    // CHANGER DE SALON
    // =========================

    roomButtons.forEach((button) => {

        button.addEventListener(
            "click",
            () => {

                const room =
                    button.dataset.room;

                joinRoom(room);

            }
        );

    });


    function joinRoom(room) {

    currentRoom = room;

    if (room === "actualites") {

        messages.style.display = "none";

        actualitesContainer.style.display = "block";

        form.style.display = "none";

        socket.emit("get actualites");

    } else {

        messages.style.display = "block";

        actualitesContainer.style.display = "none";

        form.style.display = "flex";

    }

    // Informer le serveur

    socket.emit(
        "join room",
        room
    );


    // Changer le titre

    roomTitle.textContent =
        roomNames[room];


    // Vider les anciens messages

    messages.innerHTML = "";

    clearReply();

    clearImage();


    // Modifier le bouton actif

    roomButtons.forEach(
        (button) => {

            button.classList.remove(
                "active"
            );

        }
    );


    const activeButton =
        document.querySelector(
            `[data-room="${room}"]`
        );


    if (activeButton) {

        activeButton.classList.add(
            "active"
        );

    }


    messageInput.focus();

}

    // =========================
    // ENVOYER UN MESSAGE
    // =========================

    form.addEventListener(
        "submit",
        (event) => {

            event.preventDefault();


            const message =
                messageInput.value.trim();


            // Il faut du texte ou une image

            if (message === "" && pendingImage === null) {

                return;

            }


            socket.emit(
                "chat message",
                {
                    message: message,
                    image: pendingImage,
                    replyTo: replyingTo ? replyingTo.id : null
                }
            );


            messageInput.value = "";

            clearImage();

            clearReply();

            messageInput.focus();

        }
    );


    // =========================
    // RÉPONDRE À UN MESSAGE
    // =========================

    const replyBar =
        document.getElementById("replyBar");

    const replyText =
        document.getElementById("replyText");

    const cancelReply =
        document.getElementById("cancelReply");

    let replyingTo = null;


    function startReply(data) {

        replyingTo = data;

        replyText.innerHTML = "";

        const strong =
            document.createElement("strong");

        strong.textContent = data.username;

        replyText.appendChild(
            document.createTextNode("Réponse à ")
        );

        replyText.appendChild(strong);

        replyText.appendChild(
            document.createTextNode(
                " : " + resumeMessage(data)
            )
        );

        replyBar.style.display = "flex";

        messageInput.focus();

    }


    function clearReply() {

        replyingTo = null;

        replyBar.style.display = "none";

    }


    function resumeMessage(data) {

        if (data.message) {

            return data.message.substring(0, 100);

        }

        return "📷 Image";

    }


    cancelReply.addEventListener("click", clearReply);


    // =========================
    // ENVOYER UNE IMAGE
    // =========================

    const attachButton =
        document.getElementById("attachButton");

    const imageInput =
        document.getElementById("imageInput");

    const imagePreview =
        document.getElementById("imagePreview");

    const previewThumb =
        document.getElementById("previewThumb");

    const removeImage =
        document.getElementById("removeImage");

    let pendingImage = null;

    // Limite côté serveur : 700 000 caractères
    const IMAGE_MAX_CHARS = 650000;


    attachButton.addEventListener("click", () => {

        imageInput.click();

    });


    imageInput.addEventListener("change", () => {

        const file = imageInput.files[0];

        if (file) {

            prepareImage(file);

        }

        imageInput.value = "";

    });


    removeImage.addEventListener("click", clearImage);


    // Coller une image avec Ctrl+V

    messageInput.addEventListener("paste", (event) => {

        const items =
            event.clipboardData
                ? event.clipboardData.items
                : [];

        for (const item of items) {

            if (item.type.startsWith("image/")) {

                prepareImage(item.getAsFile());

                event.preventDefault();

                return;

            }

        }

    });


    function clearImage() {

        pendingImage = null;

        previewThumb.src = "";

        imagePreview.style.display = "none";

    }


    // Redimensionne et compresse l'image avant l'envoi

    function prepareImage(file) {

        if (!file || !file.type.startsWith("image/")) {

            alert("Ce fichier n'est pas une image.");

            return;

        }

        const reader = new FileReader();

        reader.onload = () => {

            const img = new Image();

            img.onload = () => {

                let maxSize = 1280;

                let quality = 0.82;

                let result = null;

                // On réduit jusqu'à passer sous la limite

                for (let i = 0; i < 8; i++) {

                    const ratio = Math.min(
                        1,
                        maxSize / Math.max(img.width, img.height)
                    );

                    const canvas =
                        document.createElement("canvas");

                    canvas.width =
                        Math.max(1, Math.round(img.width * ratio));

                    canvas.height =
                        Math.max(1, Math.round(img.height * ratio));

                    const ctx = canvas.getContext("2d");

                    // Fond blanc pour les PNG transparents

                    ctx.fillStyle = "#ffffff";

                    ctx.fillRect(0, 0, canvas.width, canvas.height);

                    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);

                    result = canvas.toDataURL("image/jpeg", quality);

                    if (result.length <= IMAGE_MAX_CHARS) {

                        break;

                    }

                    maxSize = Math.round(maxSize * 0.8);

                    quality = Math.max(0.5, quality - 0.06);

                }

                if (!result || result.length > IMAGE_MAX_CHARS) {

                    alert("Image trop lourde.");

                    return;

                }

                pendingImage = result;

                previewThumb.src = result;

                imagePreview.style.display = "flex";

                messageInput.focus();

            };

            img.onerror = () => {

                alert("Impossible de lire cette image.");

            };

            img.src = reader.result;

        };

        reader.readAsDataURL(file);

    }


    // =========================
    // AGRANDIR UNE IMAGE
    // =========================

    const lightbox =
        document.getElementById("lightbox");

    const lightboxImg =
        document.getElementById("lightboxImg");

    lightbox.addEventListener("click", () => {

        lightbox.style.display = "none";

        lightboxImg.src = "";

    });

    function openLightbox(src) {

        lightboxImg.src = src;

        lightbox.style.display = "flex";

    }


    socket.on("message error", (text) => {

        alert(text);

    });

// =========================

socket.on("actualites", (posts) => {

// =========================
// AFFICHER UN MESSAGE
// =========================

function afficherMessage(data) {

    const messageElement =
        document.createElement("div");

    messageElement.classList.add(
        "message"
    );

    messageElement.dataset.id = data.id;


    // En-tête : pseudo + bouton Répondre

    const usernameElement =
        document.createElement("div");

    usernameElement.classList.add(
        "username"
    );

    usernameElement.textContent =
        data.username;


    const actions =
        document.createElement("span");

    actions.classList.add("message-actions");

    const replyButton =
        document.createElement("button");

    replyButton.type = "button";

    replyButton.classList.add("reply-button");

    replyButton.textContent = "↩ Répondre";

    replyButton.addEventListener("click", () => {

        startReply(data);

    });

    actions.appendChild(replyButton);

    usernameElement.appendChild(actions);

    messageElement.appendChild(
        usernameElement
    );


    // Citation du message auquel on répond

    if (data.replyTo) {

        const quote =
            document.createElement("div");

        quote.classList.add("reply-quote");

        const quoteName =
            document.createElement("strong");

        quoteName.textContent =
            data.replyTo.username;

        quote.appendChild(quoteName);

        quote.appendChild(
            document.createTextNode(
                data.replyTo.message ||
                (data.replyTo.hasImage ? "📷 Image" : "")
            )
        );

        quote.addEventListener("click", () => {

            const target =
                messages.querySelector(
                    `[data-id="${data.replyTo.id}"]`
                );

            if (target) {

                target.scrollIntoView({
                    behavior: "smooth",
                    block: "center"
                });

                target.classList.add("highlight");

                setTimeout(() => {

                    target.classList.remove("highlight");

                }, 1500);

            }

        });

        messageElement.appendChild(quote);

    }


    // Texte

    if (data.message) {

        const textElement =
            document.createElement("div");

        textElement.classList.add(
            "message-text"
        );

        textElement.textContent =
            data.message;

        messageElement.appendChild(
            textElement
        );

    }


    // Image

    if (data.image) {

        const imageElement =
            document.createElement("img");

        imageElement.classList.add("message-image");

        imageElement.src = data.image;

        imageElement.alt = "Image envoyée par " + data.username;

        imageElement.addEventListener("load", () => {

            messages.scrollTop = messages.scrollHeight;

        });

        imageElement.addEventListener("click", () => {

            openLightbox(data.image);

        });

        messageElement.appendChild(imageElement);

    }


    messages.appendChild(
        messageElement
    );

}


// =========================
// HISTORIQUE D'UN SALON
// =========================

socket.on(
    "room history",
    (history) => {

        // Vider les messages affichés

        messages.innerHTML = "";


        // Afficher tous les anciens messages

        history.forEach(
            (message) => {

                afficherMessage(message);

            }
        );


        // Aller directement en bas

        messages.scrollTop =
            messages.scrollHeight;

    }
);


// =========================
// NOUVEAU MESSAGE
// =========================

socket.on(
    "chat message",
    (data) => {

        // Ne pas afficher un message
        // provenant d'un autre salon

        if (data.room !== currentRoom) {
            return;
        }


        afficherMessage(data);


        // Descendre automatiquement

        messages.scrollTop =
            messages.scrollHeight;

    }
);

// =========================
// UTILISATEURS EN LIGNE
// =========================

socket.on("online count", (count) => {

    onlineCount.textContent = count;

});

   // =========================
// LISTE DES UTILISATEURS
// =========================

socket.on("online users", (users) => {

    onlineUsers.innerHTML = "";


    if (users.length === 0) {

        const emptyMessage =
            document.createElement("div");

        emptyMessage.classList.add(
            "online-user"
        );

        emptyMessage.textContent =
            "Aucune personne en ligne.";

        onlineUsers.appendChild(
            emptyMessage
        );

        return;
    }


    users.forEach((username) => {

        const userElement =
            document.createElement("div");

        userElement.classList.add(
            "online-user"
        );

        userElement.textContent =
            username;

        onlineUsers.appendChild(
            userElement
        );

    });

});


// =========================
// OUVRIR LA LISTE
// =========================

onlineButton.addEventListener(
    "click",
    () => {

        onlinePanel.style.display = "block";

    }
);


// =========================
// FERMER LA LISTE
// =========================

closeOnlinePanel.addEventListener(
    "click",
    () => {

        onlinePanel.style.display = "none";

    }
);

   
</script>
